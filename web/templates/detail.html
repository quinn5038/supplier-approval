<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>审批详情 - {{ supplier_name or todo_id }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="topbar">
        <div>
            <h1 id="page-title">{{ supplier_name or '供应商审批详情' }}</h1>
            <div class="meta">todoId: {{ todo_id }}</div>
        </div>
        <div class="actions">
            <a href="/" class="btn btn-outline" style="text-decoration:none;">返回列表</a>
        </div>
    </div>

    <div class="container">
        <div id="alert-area"></div>

        <!-- 进度区 -->
        <div id="progress-area" style="display:none;">
            <div class="progress-bar">
                <div class="step"><span class="spinner"></span><span id="step-text">准备中...</span></div>
                <div class="hint" id="step-hint">单家供应商处理约 2-3 分钟，请耐心等待</div>
            </div>
        </div>

        <!-- 启动审批入口在首页「后台审批」按钮，详情页仅展示结果与重新审批（9/6 移除重复引导） -->

        <!-- 报告区 -->
        <div id="report-area" style="display:none;">
            <div style="text-align:right; margin-bottom:12px;">
                <button class="btn btn-outline" onclick="reRunApprove()">重新审批（供应商更新了材料时使用）</button>
            </div>
            <div class="report-section">
                <h2>供应商材料审查报告</h2>
                <div id="report-content"></div>
            </div>
            <!-- 9/5 反转修复：保留独立"最终审批意见（可一键复制）"section，
                 删卡片内 opinion-area（重复且不可一键复制） -->
            <div class="report-section">
                <h2>最终审批意见（可直接复制）</h2>
                <div style="display:flex; justify-content:flex-end; margin-bottom:8px;">
                    <button class="btn btn-outline" onclick="copyOpinion()">复制全文</button>
                </div>
                <div class="opinion-box" id="opinion-content"></div>
            </div>
        </div>

        <!-- 无审批结果 / 加载失败提示区（启动入口已上移至首页，详情页只展示结果） -->
        <div id="error-area" style="display:none;">
            <div class="alert alert-warning" id="error-msg"></div>
            <div style="text-align:center; margin-top:16px;">
                <a href="/" class="btn btn-outline" style="text-decoration:none;">返回列表</a>
            </div>
        </div>
    </div>

    <script>
        const TODO_ID = "{{ todo_id }}";
        let pollTimer = null;
        let opinionText = "";

        // ===== 重新审批（供应商更新了材料时使用）=====
        async function reRunApprove() {
            if (!confirm('确认重新审批？系统将重新下载材料并跑完整流水线（约2-3分钟）。')) return;
            // 隐藏报告区，显示进度区
            document.getElementById('report-area').style.display = 'none';
            document.getElementById('error-area').style.display = 'none';
            document.getElementById('progress-area').style.display = 'block';
            document.getElementById('step-text').textContent = '正在重新拉取供应商数据...';
            try {
                const r = await fetch('/api/approve/' + TODO_ID, { method: 'POST' });
                if (r.status === 409) {
                    alert('正在处理中，请勿重复点击');
                    return;
                }
                // 重启轮询
                if (pollTimer) clearInterval(pollTimer);
                pollTimer = setInterval(pollStatus, 2000);
            } catch (e) {
                alert('网络错误：' + e.message);
            }
        }

        // ===== 轮询状态 =====
        async function pollStatus() {
            try {
                const r = await fetch('/api/status/' + TODO_ID);
                const data = await r.json();
                document.getElementById('step-text').textContent = data.step || '处理中...';

                if (data.status === 'done') {
                    clearInterval(pollTimer);
                    document.getElementById('progress-area').style.display = 'none';
                    loadReport();
                } else if (data.status === 'error') {
                    clearInterval(pollTimer);
                    document.getElementById('progress-area').style.display = 'none';
                    document.getElementById('error-area').style.display = 'block';
                    document.getElementById('error-msg').textContent = '⚠ ' + (data.error || '处理失败');
                    if (data.step === 'cookie_expired') {
                        document.getElementById('error-msg').innerHTML +=
                            '<br><br>请<a href="/">返回列表</a>，点击右上角"更新 Cookie"后重试。';
                    }
                }
            } catch (e) {
                console.error('状态查询失败:', e);
            }
        }

        // ===== 加载报告 =====
        async function loadReport() {
            try {
                const r = await fetch('/api/report/' + TODO_ID);
                if (!r.ok) {
                    const err = await r.json();
                    throw new Error(err.msg || '加载失败');
                }
                const data = await r.json();
                document.getElementById('report-content').innerHTML = data.report_html || '<p>无报告内容</p>';
                // 9/5 反转修复：opinion 展示在下方独立"最终审批意见"section 的 opinion-content
                document.getElementById('opinion-content').textContent = data.opinion_text || '';
                opinionText = data.opinion_text || '';
                document.getElementById('report-area').style.display = 'block';
            } catch (e) {
                document.getElementById('error-area').style.display = 'block';
                document.getElementById('error-msg').textContent = '⚠ ' + e.message;
            }
        }

        // ===== 复制意见 =====
        function copyOpinion() {
            if (!opinionText) { alert('意见为空'); return; }
            navigator.clipboard.writeText(opinionText).then(() => {
                const btn = event.target;
                const old = btn.textContent;
                btn.textContent = '已复制';
                setTimeout(() => { btn.textContent = old; }, 1500);
            }).catch(() => {
                // fallback
                const ta = document.createElement('textarea');
                ta.value = opinionText;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                alert('已复制到剪贴板');
            });
        }

        // 启动审批入口已上移至首页「后台审批」按钮，详情页只负责展示结果与重新审批
        // 页面加载时：直接查是否已有报告
        (async function init() {
            try {
                const rr = await fetch('/api/report/' + TODO_ID);
                if (rr.ok) {
                    // 已有结果，直接展示
                    const data = await rr.json();
                    document.getElementById('report-area').style.display = 'block';
                    document.getElementById('report-content').innerHTML = data.report_html || '<p>无报告内容</p>';
                    document.getElementById('opinion-content').textContent = data.opinion_text || '';
                    opinionText = data.opinion_text || '';
                    return;
                }
                // 无结果（404 或渲染异常）：显示友好提示并提供返回入口
                document.getElementById('error-area').style.display = 'block';
                document.getElementById('error-msg').innerHTML =
                    '该供应商暂无审批结果，请<a href="/" style="color:var(--color-primary);">返回列表</a>，点击对应行的「后台审批」按钮开始审批。';
            } catch (e) {
                console.error('初始化检查失败:', e);
                document.getElementById('error-area').style.display = 'block';
                document.getElementById('error-msg').textContent = '⚠ 加载失败：' + e.message;
            }
        })();
    </script>
</body>
</html>
